<h1
  style="
    margin: 0 0 28px 0;
    color: #111827;
    font-size: 30px;
    line-height: 38px;
    font-weight: 700;
  "
>
  Your account has been approved
</h1>

<p
  style="
    margin: 0 0 12px 0;
    color: #111827;
    font-size: 17px;
    line-height: 26px;
    font-weight: 600;
  "
>
  Dear {{name}},
</p>

<p
  style="
    margin: 0 0 24px 0;
    color: #53627c;
    font-size: 16px;
    line-height: 25px;
  "
>
  Your KYC application has been approved successfully and your trading
  account is now active.
</p>

<table
  cellpadding="0"
  cellspacing="0"
  style="
    width: 100%;
    margin: 0 0 24px 0;
    border-collapse: collapse;
    background: #f8fafc;
    border-radius: 8px;
  "
>
  <tr>
    <td style="padding: 12px 16px; color: #53627c;">
      Account Number
    </td>
    <td
      style="
        padding: 12px 16px;
        color: #111827;
        font-weight: 600;
      "
    >
      {{accountNumber}}
    </td>
  </tr>

  <tr>
    <td style="padding: 12px 16px; color: #53627c;">
      Platform
    </td>
    <td
      style="
        padding: 12px 16px;
        color: #111827;
        font-weight: 600;
      "
    >
      {{platform}}
    </td>
  </tr>

  <tr>
    <td style="padding: 12px 16px; color: #53627c;">
      Currency
    </td>
    <td
      style="
        padding: 12px 16px;
        color: #111827;
        font-weight: 600;
      "
    >
      {{currency}}
    </td>
  </tr>
</table>

<p
  style="
    margin: 0;
    color: #53627c;
    font-size: 14px;
    line-height: 23px;
  "
>
  You can now sign in and access your trading account.
</p>
