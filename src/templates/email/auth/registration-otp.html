<h1
  style="
    margin: 0 0 28px 0;
    color: #111827;
    font-size: 30px;
    line-height: 38px;
    font-weight: 700;
  "
>
  Verify your email
</h1>

<p
  style="
    margin: 0 0 12px 0;
    color: #111827;
    font-size: 17px;
    line-height: 26px;
    font-weight: 600;
  "
>
  Dear {{name}},
</p>

<p
  style="
    margin: 0 0 24px 0;
    color: #53627c;
    font-size: 16px;
    line-height: 25px;
  "
>
  Use the verification code below to verify your email address and complete
  your TradePro registration.
</p>

<div
  style="
    margin: 0 0 24px 0;
    padding: 18px;
    background: #f3f6fb;
    border-radius: 8px;
    text-align: center;
  "
>
  <span
    style="
      color: #111827;
      font-size: 30px;
      line-height: 38px;
      font-weight: 700;
      letter-spacing: 6px;
    "
  >
    {{otp}}
  </span>
</div>

<p
  style="
    margin: 0 0 24px 0;
    color: #53627c;
    font-size: 14px;
    line-height: 23px;
  "
>
  This verification code will expire in {{expiresIn}} minutes.
</p>

<p
  style="
    margin: 0;
    color: #53627c;
    font-size: 14px;
    line-height: 23px;
  "
>
  If you did not request this registration, you can ignore this email.
</p>
